name: Refresh

# The README regenerates itself. Weekly rather than daily: the numbers on the
# card move slowly, and a daily commit would be fifty-two times the git
# history for the same information.
#
# 06:17 on Mondays, not 00:00. GitHub queues scheduled workflows and drops
# them under load, and the top of the hour - especially midnight UTC - is when
# everyone else's cron is also firing. An odd minute gets picked up promptly.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  # So a change to the generator is visible without waiting for Monday.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh.yml"

# The job commits the regenerated files, which is a write to this repository's
# contents. Nothing else here needs a permission.
permissions:
  contents: write

# Never two of these at once: they both commit to main, and the loser would be
# rejected on push after doing all the work.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # No install step, deliberately. The generator has no runtime
      # dependencies at all - Bun's standard library, three vendored files of
      # pure maths, and a PNG writer that is sixty lines of node:zlib. The
      # only entries in package.json are type definitions, which nothing here
      # needs to run.
      - name: Generate
        env:
          # A fine-grained PAT with read:user, which is the only way to read
          # the contributions graph. Falls back to the built-in token, which
          # can do everything except that - so a missing or expired secret
          # costs the card one row instead of breaking the run.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: bun run generate

      # `git diff --quiet` is the whole check. The generator already declines
      # to rewrite a file whose bytes have not changed, so on a quiet week
      # there is genuinely nothing here and no commit is made.
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh profile stats"
          git push
